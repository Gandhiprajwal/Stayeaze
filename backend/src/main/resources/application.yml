server:
  port: 8080
  address: 0.0.0.0
  http2:
    enabled: true
  error:
    include-stacktrace: never
    include-message: never
    whitelabel:
      enabled: false

  compression:
    enabled: true
    mime-types: application/json,text/html,text/xml,text/plain,application/xml,text/css,application/javascript
    min-response-size: 1024

  tomcat:
    threads:
      max: 500
      min-spare: 100
    accept-count: 2000
    max-connections: 10000

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: stayeaze-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stayeaze}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 25
      minimum-idle: 10
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
      leak-detection-threshold: 5000
      pool-name: StayEazeHikariPool
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        tenant_identifier_resolver: com.stayeaze.backend.config.TenantIdentifierResolver
        cache:
          use_second_level_cache: true
          region:
            factory_class: org.hibernate.cache.jcache.JCacheRegionFactory

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
resilience4j:
  circuitbreaker:
    instances:
      externalPaymentGateway:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000ms
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      notificationService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000ms
  timelimiter:
    instances:
      externalPaymentGateway:
        timeout-duration: 3000ms
      notificationService:
        timeout-duration: 4000ms

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250655368566D5970} # 256-bit key
  expiration: 900000 # 15 minutes (in ms)
  refresh-expiration: 604800000 # 7 days (in ms)

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}

razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:rzp_test_TMzrAcqaVP9Rns}
    secret: ${RAZORPAY_KEY_SECRET:bX0tO4IY9Gzw4lN7CQE4L12O}

logging:
  level:
    root: INFO
    com.stayeaze: INFO
    org.apache.catalina.core.ContainerBase: ERROR
    org.apache.catalina.core.AsyncContextImpl: ERROR
    org.apache.catalina.connector.CoyoteAdapter: ERROR
    org.apache.coyote.http11.Http11Processor: ERROR
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR
